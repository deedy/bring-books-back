server {
    listen 8080 default_server;
    server_name grandoldbooks.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Cache static assets aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect image requests to GCS bucket (images not baked into container)
    location /data/images/ {
        return 301 https://storage.googleapis.com/grandoldbooks-assets$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 301 redirect: old barrister-parvatishan URLs → barrister-parvateesam
    location ~ ^/(books|read)/barrister-parvatishan(.*)$ {
        return 301 /$1/barrister-parvateesam$2;
    }

    # SPA fallback: try file, then directory index, then 404 page
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }
}

# Redirect www → apex
server {
    listen 8080;
    server_name www.grandoldbooks.com;
    return 301 https://grandoldbooks.com$request_uri;
}
